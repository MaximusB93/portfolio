<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Кейс 1. Сквозной DataLens-дашборд</title>
  <desc id="desc">Скриншот кейса из презентации портфолио: CRM / Метрика / реклама / продажи</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#0d1b2e"/><stop offset="1" stop-color="#16112c"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#6ee7f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="bar0" x1="0" x2="0" y1="1" y2="0"><stop stop-color="#223b62"/><stop offset="1" stop-color="#6ee7f9"/></linearGradient>
    <linearGradient id="bar1" x1="0" x2="0" y1="1" y2="0"><stop stop-color="#30244f"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity=".34"/></filter>
    <style>
      .kicker{font:700 24px Inter,Arial,sans-serif;fill:#6ee7f9;letter-spacing:.08em;text-transform:uppercase}
      .title{font:900 52px Inter,Arial,sans-serif;fill:#f5f7fb;letter-spacing:-1.8px}
      .sub{font:500 22px Inter,Arial,sans-serif;fill:#aab8cc}
      .metricLabel{font:700 16px Inter,Arial,sans-serif;fill:#aab8cc;text-transform:uppercase;letter-spacing:.08em}
      .metricValue{font:900 26px Inter,Arial,sans-serif;fill:#f5f7fb}
      .bullet{font:600 24px Inter,Arial,sans-serif;fill:#d8e2f3}
      .small{font:700 18px Inter,Arial,sans-serif;fill:#aab8cc}
      .result{font:900 28px Inter,Arial,sans-serif;fill:#07111f}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1120" cy="20" r="250" fill="#a78bfa" opacity=".16"/>
  <circle cx="120" cy="110" r="220" fill="#6ee7f9" opacity=".12"/>
  <rect x="42" y="42" width="1116" height="591" rx="34" fill="rgba(255,255,255,.055)" stroke="rgba(255,255,255,.14)" filter="url(#shadow)"/>
  <text x="70" y="98" class="kicker">CRM / Метрика / реклама / продажи</text>
  <text x="70" y="166" class="title">Кейс 1. Сквозной DataLens-дашборд</text>
  
      <g transform="translate(70 178)">
        <rect width="152" height="74" rx="16" fill="rgba(255,255,255,.09)" stroke="rgba(255,255,255,.16)"/>
        <text x="18" y="30" class="metricLabel">Выручка</text>
        <text x="18" y="58" class="metricValue">12.4M</text>
      </g>
      <g transform="translate(260 178)">
        <rect width="152" height="74" rx="16" fill="rgba(255,255,255,.09)" stroke="rgba(255,255,255,.16)"/>
        <text x="18" y="30" class="metricLabel">Продажи</text>
        <text x="18" y="58" class="metricValue">3 284</text>
      </g>
      <g transform="translate(450 178)">
        <rect width="152" height="74" rx="16" fill="rgba(255,255,255,.09)" stroke="rgba(255,255,255,.16)"/>
        <text x="18" y="30" class="metricLabel">CR</text>
        <text x="18" y="58" class="metricValue">8.7%</text>
      </g>
      <g transform="translate(640 178)">
        <rect width="152" height="74" rx="16" fill="rgba(255,255,255,.09)" stroke="rgba(255,255,255,.16)"/>
        <text x="18" y="30" class="metricLabel">ДРР</text>
        <text x="18" y="58" class="metricValue">18%</text>
      </g>
  <rect x="70" y="292" width="470" height="178" rx="24" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.14)"/>
  <line x1="92" y1="420" x2="504" y2="420" stroke="rgba(255,255,255,.2)"/>
  <line x1="92" y1="330" x2="92" y2="420" stroke="rgba(255,255,255,.2)"/>
  <rect x="72" y="334" width="46" height="86" rx="8" fill="url(#bar0)"/><rect x="158" y="292" width="46" height="128" rx="8" fill="url(#bar1)"/><rect x="244" y="354" width="46" height="66" rx="8" fill="url(#bar0)"/><rect x="330" y="274" width="46" height="146" rx="8" fill="url(#bar1)"/><rect x="416" y="316" width="46" height="104" rx="8" fill="url(#bar0)"/><rect x="502" y="252" width="46" height="168" rx="8" fill="url(#bar1)"/><rect x="588" y="302" width="46" height="118" rx="8" fill="url(#bar0)"/>
  <rect x="588" y="292" width="500" height="178" rx="24" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.14)"/>
  <text x="610" y="324" class="bullet">→ Воронка: показы → визиты → корзины → продажи</text><text x="610" y="366" class="bullet">→ Источники: расходы, CPL, CPO, окупаемость</text><text x="610" y="408" class="bullet">→ Фильтры по периоду и источнику</text>
  <rect x="70" y="510" width="1018" height="70" rx="22" fill="url(#accent)"/>
  <text x="96" y="555" class="result">Результат: полная автоматизация отчётности</text>
  <text x="70" y="612" class="small">Будников Максим • маркетинговая аналитика / BI / Martech</text>
  <text x="1060" y="612" class="small">01</text>
</svg>